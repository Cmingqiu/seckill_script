<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:grid;
    place-items:center;
    background:radial-gradient(115% 90% at 50% 0%, #f7fdff 0%, #dceff9 50%, #c6e2f2 100%);
    font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .stage{
    width:min(1120px,96vw);
    filter:drop-shadow(0 26px 36px rgba(56,94,118,.20));
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    border-radius:24px;
    overflow:hidden;
    background:#eaf8fe;
  }
  .scroller{ animation:scroll 2.1s linear infinite; }
  @keyframes scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-900px); }
  }
  .sp{ animation:dash 1.5s linear infinite; opacity:0; }
  .sp:nth-child(2){ animation-delay:.5s; }
  .sp:nth-child(3){ animation-delay:1s; }
  @keyframes dash{
    0%{ transform:translateX(34px); opacity:0; }
    22%{ opacity:.9; }
    100%{ transform:translateX(-150px); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce){
    .scroller,.sp{ animation:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑着自行车在乡间小路上前进">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f0fbff"/>
        <stop offset=".62" stop-color="#d8f0fb"/>
        <stop offset="1" stop-color="#c6e8f7"/>
      </linearGradient>
      <radialGradient id="sunGlow">
        <stop offset="0" stop-color="#fffdf0" stop-opacity=".95"/>
        <stop offset=".45" stop-color="#fff8e2" stop-opacity=".55"/>
        <stop offset="1" stop-color="#fff8e2" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="body" cx="34%" cy="26%" r="86%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".48" stop-color="#fdfaf2"/>
        <stop offset="1" stop-color="#e7ddca"/>
      </radialGradient>
      <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f9cf78"/>
        <stop offset="1" stop-color="#ea9630"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f8b455"/>
        <stop offset="1" stop-color="#e68b26"/>
      </linearGradient>

      <g id="groundDecor">
        <rect x="40" y="450" width="76" height="6" rx="3" fill="#cabb9e"/>
        <rect x="220" y="450" width="76" height="6" rx="3" fill="#cabb9e"/>
        <rect x="400" y="450" width="76" height="6" rx="3" fill="#cabb9e"/>
        <rect x="580" y="450" width="76" height="6" rx="3" fill="#cabb9e"/>
        <rect x="760" y="450" width="76" height="6" rx="3" fill="#cabb9e"/>
        <g stroke="#b2d99a" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M120 508 C 120 496, 124 490, 130 486"/>
          <path d="M120 508 C 118 498, 112 492, 106 490"/>
          <path d="M330 512 C 330 500, 334 494, 340 490"/>
          <path d="M330 512 C 328 502, 322 496, 316 494"/>
          <path d="M560 506 C 560 494, 564 488, 570 484"/>
          <path d="M700 514 C 700 502, 704 496, 710 492"/>
          <path d="M700 514 C 698 504, 692 498, 686 496"/>
        </g>
        <g fill="#f3d98a">
          <circle cx="240" cy="508" r="5"/>
          <circle cx="486" cy="512" r="5"/>
          <circle cx="840" cy="506" r="5"/>
        </g>
      </g>
    </defs>

    <!-- 天空与远景 -->
    <rect width="900" height="520" fill="url(#sky)"/>
    <circle cx="150" cy="94" r="140" fill="url(#sunGlow)"/>
    <circle cx="150" cy="94" r="40" fill="#fff6dc"/>

    <path d="M0 330 C 96 296, 168 316, 236 340 C 300 362, 352 330, 424 320 C 500 310, 556 344, 636 340 C 716 336, 792 310, 900 328 L900 420 L0 420 Z" fill="#c4e2d0"/>
    <path d="M0 366 C 128 342, 214 364, 316 352 C 424 340, 520 366, 640 354 C 752 342, 826 358, 900 350 L900 430 L0 430 Z" fill="#a5d2b8"/>

    <!-- 地面与小路 -->
    <rect y="388" width="900" height="132" fill="#daefc8"/>
    <rect y="404" width="900" height="64" fill="#e6dac5"/>
    <rect y="402" width="900" height="4" fill="#cdbda4"/>
    <rect y="466" width="900" height="4" fill="#cdbda4"/>

    <g class="scroller">
      <use href="#groundDecor"/>
      <use href="#groundDecor" x="900"/>
    </g>

    <!-- 影子 -->
    <ellipse cx="452" cy="448" rx="210" ry="15" fill="#b7a48a" opacity=".3"/>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
      <line class="sp" x1="150" y1="236" x2="206" y2="236"/>
      <line class="sp" x1="176" y1="298" x2="232" y2="298"/>
      <line class="sp" x1="130" y1="356" x2="186" y2="356"/>
    </g>

    <!-- 轮辐（旋转） -->
    <g id="wheelBack" stroke="#a99f92" stroke-width="3">
      <line x1="250" y1="380" x2="350" y2="380"/>
      <line x1="300" y1="330" x2="300" y2="430"/>
      <line x1="264.6" y1="344.6" x2="335.4" y2="415.4"/>
      <line x1="264.6" y1="415.4" x2="335.4" y2="344.6"/>
      <circle cx="300" cy="380" r="7" fill="#8f8779" stroke="none"/>
    </g>
    <g id="wheelFront" stroke="#a99f92" stroke-width="3">
      <line x1="550" y1="380" x2="650" y2="380"/>
      <line x1="600" y1="330" x2="600" y2="430"/>
      <line x1="564.6" y1="344.6" x2="635.4" y2="415.4"/>
      <line x1="564.6" y1="415.4" x2="635.4" y2="344.6"/>
      <circle cx="600" cy="380" r="7" fill="#8f8779" stroke="none"/>
    </g>

    <!-- 轮胎与轮圈 -->
    <g fill="none">
      <circle cx="300" cy="380" r="62" stroke="#33302c" stroke-width="13"/>
      <circle cx="600" cy="380" r="62" stroke="#33302c" stroke-width="13"/>
      <circle cx="300" cy="380" r="55" stroke="#9c9384" stroke-width="5"/>
      <circle cx="600" cy="380" r="55" stroke="#9c9384" stroke-width="5"/>
    </g>

    <!-- 远侧腿 -->
    <g stroke-linecap="round" fill="none">
      <line id="farThigh" x1="344" y1="298" x2="376" y2="344" stroke="#c96a24" stroke-width="10.5"/>
      <line id="farCalf"  x1="376" y1="344" x2="404" y2="392" stroke="#c96a24" stroke-width="9.5"/>
    </g>
    <g id="farFoot">
      <rect x="-18" y="3" width="36" height="8" rx="4" fill="#4a443e"/>
      <path d="M-14 -7 C -4 -12, 10 -11, 24 -4 C 27 0, 25 5, 18 5 L -11 5 C -16 5, -17 -3, -14 -7 Z" fill="#c96a24"/>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#2f6e63" stroke-linecap="round" stroke-linejoin="round">
      <path d="M420 398 L300 380 M352 318 L300 380 M352 318 L420 398 M352 318 L588 314 M420 398 L578 352 M578 352 L588 314" stroke-width="9"/>
      <path d="M588 314 C 592 336, 596 358, 600 380" stroke-width="8"/>
      <path d="M588 314 C 590 298, 600 288, 618 290" stroke-width="8"/>
    </g>
    <!-- 链条 -->
    <g stroke="#7a6f63" stroke-width="2.5" fill="none">
      <path d="M420 380 L302 370"/>
      <path d="M420 416 L302 392"/>
    </g>
    <!-- 车座 -->
    <rect x="314" y="302" width="64" height="15" rx="7.5" transform="rotate(-7 346 309)" fill="#4b403a"/>

    <!-- 曲柄与牙盘 -->
    <g id="crank">
      <line x1="420" y1="398" x2="450" y2="398" stroke="#3a332e" stroke-width="7" stroke-linecap="round"/>
      <line x1="420" y1="398" x2="390" y2="398" stroke="#3a332e" stroke-width="7" stroke-linecap="round"/>
      <circle cx="420" cy="398" r="20" fill="none" stroke="#3a332e" stroke-width="6"/>
      <circle cx="420" cy="398" r="9" fill="#3a332e"/>
      <circle cx="420" cy="398" r="4.5" fill="#8f8779"/>
    </g>

    <!-- 近侧腿 -->
    <g stroke-linecap="round" fill="none">
      <line id="nearThigh" x1="358" y1="302" x2="392" y2="346" stroke="#e8802f" stroke-width="10.5"/>
      <line id="nearCalf"  x1="392" y1="346" x2="420" y2="394" stroke="#e8802f" stroke-width="9.5"/>
    </g>
    <g id="nearFoot">
      <rect x="-18" y="3" width="36" height="8" rx="4" fill="#4a443e"/>
      <path d="M-14 -7 C -4 -12, 10 -11, 24 -4 C 27 0, 25 5, 18 5 L -11 5 C -16 5, -17 -3, -14 -7 Z" fill="#e8802f"/>
      <path d="M4 -3 L 10 4" stroke="#c96a24" stroke-width="1.6" stroke-linecap="round" opacity=".55"/>
    </g>

    <!-- 鹈鹕 -->
    <g id="bird">
      <!-- 尾羽 -->
      <path d="M272 252 C 238 238, 204 240, 186 254 C 208 258, 226 268, 236 282 L 252 276 L 256 290 C 264 282, 272 270, 278 258 Z"
            fill="#e9e1cf" stroke="#d5c9ae" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="330" cy="252" rx="66" ry="52" transform="rotate(-16 330 252)" fill="url(#body)"/>

      <!-- 翅膀 -->
      <g id="wing">
        <path d="M286 212 C 318 192, 368 198, 390 224 C 410 252, 398 290, 360 302 C 324 312, 292 292, 284 262 C 278 242, 279 220, 286 212 Z"
              fill="#efe5d0"/>
        <path d="M288 248 C 310 264, 348 270, 386 258" stroke="#d8cbaf" stroke-width="4" fill="none" stroke-linecap="round" opacity=".85"/>
        <path d="M292 274 C 314 288, 344 292, 370 282" stroke="#d8cbaf" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
      </g>

      <!-- 脖子 -->
      <path d="M378 226 C 394 200, 400 172, 424 156" stroke="#fdfaf3" stroke-width="34" stroke-linecap="round" fill="none"/>
      <path d="M384 232 C 400 208, 406 182, 426 168" stroke="#e6dcc7" stroke-width="3.5" fill="none" stroke-linecap="round" opacity=".8"/>

      <!-- 头 -->
      <g id="head">
        <!-- 冠羽 -->
        <path d="M436 98 C 428 82, 414 76, 402 80 C 412 87, 419 95, 422 105" fill="#f7f2e7" stroke="#e2d8c5" stroke-width="2"/>
        <path d="M452 94 C 449 78, 440 70, 430 70 C 438 78, 443 86, 444 96" fill="#f7f2e7" stroke="#e2d8c5" stroke-width="2"/>

        <ellipse cx="466" cy="130" rx="40" ry="37" fill="url(#body)"/>

        <!-- 喉囊 -->
        <path id="pouch"
              d="M502 144 C 552 148, 610 150, 654 154 C 650 184, 626 212, 588 220 C 550 228, 516 210, 504 188 C 497 172, 497 156, 502 144 Z"
              fill="url(#pouchGrad)" stroke="#dd9430" stroke-width="2.5"/>
        <path d="M512 174 C 532 196, 566 208, 610 198" stroke="#dd9430" stroke-width="2.5" fill="none" opacity=".45" stroke-linecap="round"/>

        <!-- 上喙 -->
        <path d="M490 106 C 545 106, 612 122, 656 138 C 668 142, 676 146, 676 152 C 674 158, 666 160, 656 157 C 604 138, 550 138, 502 144 C 490 142, 484 126, 490 106 Z"
              fill="url(#beakGrad)" stroke="#d48526" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="530" cy="120" r="2.4" fill="#c4761c" opacity=".7"/>

        <!-- 眼睛 -->
        <circle cx="476" cy="116" r="7" fill="#2b2724"/>
        <circle cx="478.4" cy="113.4" r="2.3" fill="#ffffff"/>
      </g>
    </g>
  </svg>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;

  var BB = { x: 420, y: 398 };
  var CRANK = 30;
  var PERIOD = 1.1;               // 曲柄一圈的秒数
  var OMEGA = TAU / PERIOD;
  var WHEEL_RATIO = 1.2;          // 轮速 / 踏频
  var KNEE_BIAS = { x: 0.94, y: 0.34 };   // 膝盖固定朝右下弯，避免高踏位时膝盖飞到髋部上方

  var wheelBack = $('wheelBack');
  var wheelFront = $('wheelFront');
  var crank = $('crank');
  var bird = $('bird');
  var head = $('head');
  var wing = $('wing');
  var pouch = $('pouch');

  var legs = [
    { ph: 0,        hx: 344, hy: 298, L: 78, thigh: $('farThigh'),  calf: $('farCalf'),  foot: $('farFoot')  },
    { ph: Math.PI,  hx: 358, hy: 302, L: 76, thigh: $('nearThigh'), calf: $('nearCalf'), foot: $('nearFoot') }
  ];

  // 两段等长腿：髋到脚中点 + 固定方向的膝偏移
  function knee(hx, hy, px, py, L) {
    var dx = px - hx, dy = py - hy;
    var d = Math.hypot(dx, dy);
    var max = L * 2 - 0.01;
    if (d > max) { var k = max / d; dx *= k; dy *= k; d = max; }
    var a = d / 2;
    var h = Math.sqrt(Math.max(0, L * L - a * a));
    return { x: hx + dx / 2 + h * KNEE_BIAS.x, y: hy + dy / 2 + h * KNEE_BIAS.y };
  }

  var phase = 0;
  var last = performance.now();

  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) { dt = 0.1; }
    phase = (phase + dt * OMEGA) % TAU;

    var deg = phase * 180 / Math.PI;
    var wheelDeg = (deg * WHEEL_RATIO).toFixed(2);

    wheelBack.setAttribute('transform', 'rotate(' + wheelDeg + ' 300 380)');
    wheelFront.setAttribute('transform', 'rotate(' + wheelDeg + ' 600 380)');
    crank.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' 420 398)');

    var bob = Math.sin(phase * 2) * 2.4;
    bird.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    head.setAttribute('transform', 'rotate(' + (Math.sin(phase * 2 - 0.7) * 2).toFixed(2) + ' 424 176)');
    wing.setAttribute('transform', 'rotate(' + (Math.sin(phase * 2 + 1.2) * 2.6).toFixed(2) + ' 310 220)');

    var s = (1 + Math.sin(phase * 2 + 0.5) * 0.04).toFixed(3);
    pouch.setAttribute('transform', 'translate(0 152) scale(1 ' + s + ') translate(0 -152)');

    for (var i = 0; i < legs.length; i++) {
      var leg = legs[i];
      var ang = phase + leg.ph;
      var px = BB.x + Math.cos(ang) * CRANK;
      var py = BB.y + Math.sin(ang) * CRANK;
      var hx = leg.hx;
      var hy = leg.hy + bob;
      var k = knee(hx, hy, px, py, leg.L);

      leg.thigh.setAttribute('x1', hx.toFixed(2));
      leg.thigh.setAttribute('y1', hy.toFixed(2));
      leg.thigh.setAttribute('x2', k.x.toFixed(2));
      leg.thigh.setAttribute('y2', k.y.toFixed(2));
      leg.calf.setAttribute('x1', k.x.toFixed(2));
      leg.calf.setAttribute('y1', k.y.toFixed(2));
      leg.calf.setAttribute('x2', px.toFixed(2));
      leg.calf.setAttribute('y2', py.toFixed(2));
      leg.foot.setAttribute('transform', 'translate(' + px.toFixed(2) + ' ' + py.toFixed(2) + ')');
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
