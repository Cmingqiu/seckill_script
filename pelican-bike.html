<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    display:grid;
    place-items:center;
    background:radial-gradient(115% 90% at 50% 0%, #f7fdff 0%, #dceff9 50%, #c6e2f2 100%);
    font-family:ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .stage{
    width:min(1120px,96vw);
    filter:drop-shadow(0 26px 36px rgba(56,94,118,.20));
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    border-radius:24px;
    overflow:hidden;
    background:#eaf8fe;
  }
  .scroller{ animation:scroll 2.1s linear infinite; }
  @keyframes scroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-900px); }
  }
  .sp{ animation:dash 1.5s linear infinite; opacity:0; }
  .sp:nth-child(2){ animation-delay:.5s; }
  .sp:nth-child(3){ animation-delay:1s; }
  @keyframes dash{
    0%{ transform:translateX(40px); opacity:0; }
    25%{ opacity:.9; }
    100%{ transform:translateX(-160px); opacity:0; }
  }
  @media (prefers-reduced-motion:reduce){
    .scroller,.sp{ animation:none; }
  }
</style>
</head>
<body>
<div class="stage">
  <svg viewBox="0 0 900 520" role="img" aria-label="一只鹈鹕骑着自行车在乡间小路上前进">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f0fbff"/>
        <stop offset=".62" stop-color="#d8f0fb"/>
        <stop offset="1" stop-color="#c6e8f7"/>
      </linearGradient>
      <radialGradient id="body" cx="35%" cy="28%" r="82%">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".55" stop-color="#fdfaf2"/>
        <stop offset="1" stop-color="#ece4d3"/>
      </radialGradient>
      <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fad27c"/>
        <stop offset="1" stop-color="#ee9d33"/>
      </linearGradient>
      <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f8b455"/>
        <stop offset="1" stop-color="#eb9430"/>
      </linearGradient>

      <g id="groundDecor">
        <rect x="40" y="450" width="76" height="6" rx="3" fill="#d3c4aa"/>
        <rect x="220" y="450" width="76" height="6" rx="3" fill="#d3c4aa"/>
        <rect x="400" y="450" width="76" height="6" rx="3" fill="#d3c4aa"/>
        <rect x="580" y="450" width="76" height="6" rx="3" fill="#d3c4aa"/>
        <rect x="760" y="450" width="76" height="6" rx="3" fill="#d3c4aa"/>
        <g stroke="#b2d99a" stroke-width="5" stroke-linecap="round" fill="none">
          <path d="M120 508 C 120 496, 124 490, 130 486"/>
          <path d="M120 508 C 118 498, 112 492, 106 490"/>
          <path d="M330 512 C 330 500, 334 494, 340 490"/>
          <path d="M330 512 C 328 502, 322 496, 316 494"/>
          <path d="M560 506 C 560 494, 564 488, 570 484"/>
          <path d="M700 514 C 700 502, 704 496, 710 492"/>
          <path d="M700 514 C 698 504, 692 498, 686 496"/>
        </g>
        <g fill="#f3d98a">
          <circle cx="240" cy="508" r="5"/>
          <circle cx="486" cy="512" r="5"/>
          <circle cx="840" cy="506" r="5"/>
        </g>
      </g>
    </defs>

    <!-- 天空与远景 -->
    <rect width="900" height="520" fill="url(#sky)"/>
    <circle cx="152" cy="90" r="92" fill="#fffdf3" opacity=".5"/>
    <circle cx="152" cy="90" r="46" fill="#fff8e2" opacity=".9"/>

    <path d="M0 330 C 96 296, 168 316, 236 340 C 300 362, 352 330, 424 320 C 500 310, 556 344, 636 340 C 716 336, 792 310, 900 328 L900 420 L0 420 Z" fill="#c4e2d0"/>
    <path d="M0 366 C 128 342, 214 364, 316 352 C 424 340, 520 366, 640 354 C 752 342, 826 358, 900 350 L900 430 L0 430 Z" fill="#a5d2b8"/>

    <!-- 地面与小路 -->
    <rect y="388" width="900" height="132" fill="#daefc8"/>
    <rect y="404" width="900" height="64" fill="#e6dac5"/>
    <rect y="402" width="900" height="4" fill="#cdbda4"/>
    <rect y="466" width="900" height="4" fill="#cdbda4"/>

    <g class="scroller">
      <use href="#groundDecor"/>
      <use href="#groundDecor" x="900"/>
    </g>

    <!-- 影子 -->
    <ellipse cx="452" cy="448" rx="210" ry="15" fill="#b7a48a" opacity=".3"/>

    <!-- 速度线 -->
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none">
      <line class="sp" x1="176" y1="166" x2="222" y2="166"/>
      <line class="sp" x1="122" y1="206" x2="178" y2="206"/>
      <line class="sp" x1="96"  y1="332" x2="152" y2="332"/>
    </g>

    <!-- 轮辐（旋转） -->
    <g id="wheelBack" stroke="#a99f92" stroke-width="3">
      <line x1="250" y1="380" x2="350" y2="380"/>
      <line x1="300" y1="330" x2="300" y2="430"/>
      <line x1="264.6" y1="344.6" x2="335.4" y2="415.4"/>
      <line x1="264.6" y1="415.4" x2="335.4" y2="344.6"/>
      <circle cx="300" cy="380" r="7" fill="#8f8779" stroke="none"/>
    </g>
    <g id="wheelFront" stroke="#a99f92" stroke-width="3">
      <line x1="550" y1="380" x2="650" y2="380"/>
      <line x1="600" y1="330" x2="600" y2="430"/>
      <line x1="564.6" y1="344.6" x2="635.4" y2="415.4"/>
      <line x1="564.6" y1="415.4" x2="635.4" y2="344.6"/>
      <circle cx="600" cy="380" r="7" fill="#8f8779" stroke="none"/>
    </g>

    <!-- 轮胎与轮圈 -->
    <g fill="none">
      <circle cx="300" cy="380" r="62" stroke="#33302c" stroke-width="13"/>
      <circle cx="600" cy="380" r="62" stroke="#33302c" stroke-width="13"/>
      <circle cx="300" cy="380" r="55" stroke="#9c9384" stroke-width="5"/>
      <circle cx="600" cy="380" r="55" stroke="#9c9384" stroke-width="5"/>
    </g>

    <!-- 远侧腿（车架后面） -->
    <g id="farLeg" stroke-linecap="round" fill="none">
      <line id="farThigh" x1="356" y1="288" x2="380" y2="340" stroke="#d4762c" stroke-width="15"/>
      <line id="farCalf"  x1="380" y1="340" x2="400" y2="392" stroke="#d4762c" stroke-width="14"/>
    </g>
    <g id="farFoot">
      <rect x="-17" y="2" width="34" height="8" rx="3" fill="#5a5047"/>
      <path d="M-13 -6 C -4 -10, 9 -9, 22 -3 C 24 1, 22 6, 16 6 L -11 6 C -15 6, -15 -2, -13 -6 Z" fill="#d4762c"/>
    </g>

    <!-- 车架 -->
    <g fill="none" stroke="#2f6e63" stroke-linecap="round" stroke-linejoin="round">
      <path d="M420 398 L300 380 M352 318 L300 380 M352 318 L420 398 M352 318 L588 314 M420 398 L578 352 M578 352 L588 314" stroke-width="9"/>
      <path d="M588 314 C 592 336, 596 358, 600 380" stroke-width="8"/>
      <path d="M588 314 C 590 298, 600 288, 618 290" stroke-width="8"/>
    </g>
    <!-- 链条 -->
    <g stroke="#7a6f63" stroke-width="2.5" fill="none">
      <path d="M420 380 L302 370"/>
      <path d="M420 416 L302 392"/>
    </g>
    <!-- 车座 -->
    <rect x="320" y="304" width="60" height="15" rx="7.5" transform="rotate(-7 350 311)" fill="#4b403a"/>

    <!-- 曲柄与牙盘 -->
    <g id="crank">
      <line x1="420" y1="398" x2="450" y2="398" stroke="#3a332e" stroke-width="7" stroke-linecap="round"/>
      <line x1="420" y1="398" x2="390" y2="398" stroke="#3a332e" stroke-width="7" stroke-linecap="round"/>
      <circle cx="420" cy="398" r="20" fill="none" stroke="#3a332e" stroke-width="6"/>
      <circle cx="420" cy="398" r="9" fill="#3a332e"/>
      <circle cx="420" cy="398" r="4.5" fill="#8f8779"/>
    </g>

    <!-- 近侧腿 -->
    <g id="nearLeg" stroke-linecap="round" fill="none">
      <line id="nearThigh" x1="372" y1="292" x2="396" y2="342" stroke="#ef8b3c" stroke-width="15"/>
      <line id="nearCalf"  x1="396" y1="342" x2="420" y2="394" stroke="#ef8b3c" stroke-width="14"/>
    </g>
    <g id="nearFoot">
      <rect x="-17" y="2" width="34" height="8" rx="3" fill="#4a443e"/>
      <path d="M-13 -6 C -4 -10, 9 -9, 22 -3 C 24 1, 22 6, 16 6 L -11 6 C -15 6, -15 -2, -13 -6 Z" fill="#ef8b3c"/>
    </g>

    <!-- 鹈鹕 -->
    <g id="bird">
      <!-- 尾羽 -->
      <path d="M266 244 C 236 232, 208 234, 192 246 C 212 250, 228 258, 238 270 L 252 266 L 254 278 C 262 272, 268 264, 272 254 Z"
            fill="#f1ebdd" stroke="#e3dbc9" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- 身体 -->
      <ellipse cx="332" cy="246" rx="80" ry="66" transform="rotate(-12 332 246)" fill="url(#body)"/>

      <!-- 翅膀 -->
      <g id="wing">
        <path d="M296 214 C 330 196, 374 202, 388 232 C 400 260, 386 292, 348 302 C 312 310, 284 288, 282 258 C 280 238, 284 222, 296 214 Z"
              fill="#fdfaf2" stroke="#e6ddcb" stroke-width="3"/>
        <path d="M300 252 C 320 264, 352 268, 380 258" stroke="#e6ddcb" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M306 274 C 326 284, 354 286, 376 278" stroke="#e6ddcb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- 脖子 -->
      <path d="M366 220 C 396 208, 408 176, 424 160" stroke="#fdfaf3" stroke-width="40" stroke-linecap="round" fill="none"/>
      <path d="M372 224 C 398 212, 410 184, 424 166" stroke="#ece4d3" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>

      <!-- 头 -->
      <g id="head">
        <!-- 冠羽 -->
        <path d="M446 94 C 436 72, 418 64, 404 68 C 417 77, 426 87, 430 99" fill="#f7f2e7" stroke="#e6ddcb" stroke-width="2"/>
        <path d="M462 90 C 458 70, 446 60, 434 60 C 444 70, 450 80, 452 92" fill="#f7f2e7" stroke="#e6ddcb" stroke-width="2"/>

        <ellipse cx="468" cy="132" rx="47" ry="44" fill="url(#body)"/>

        <!-- 喉囊 -->
        <path id="pouch"
              d="M510 146 C 556 152, 626 152, 674 158 C 672 190, 646 224, 606 234 C 566 244, 526 224, 510 194 C 502 176, 502 158, 510 146 Z"
              fill="url(#pouchGrad)" stroke="#e29a35" stroke-width="3"/>
        <path d="M524 178 C 548 202, 588 216, 640 206" stroke="#e09a35" stroke-width="2.5" fill="none" opacity=".55" stroke-linecap="round"/>

        <!-- 上喙 -->
        <path d="M496 102 C 548 100, 620 116, 674 136 C 688 141, 696 145, 697 150 C 695 158, 686 160, 676 157 C 614 143, 552 142, 512 148 C 498 148, 492 128, 496 102 Z"
              fill="url(#beakGrad)" stroke="#d98c2c" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="542" cy="118" r="2.6" fill="#c97a20" opacity=".7"/>

        <!-- 眼睛 -->
        <circle cx="492" cy="120" r="8" fill="#2b2724"/>
        <circle cx="494.6" cy="117.2" r="2.5" fill="#ffffff"/>
      </g>
    </g>
  </svg>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TAU = Math.PI * 2;

  var BB = { x: 420, y: 398 };
  var CRANK = 30;
  var PERIOD = 1.1;               // 曲柄一圈的秒数
  var OMEGA = TAU / PERIOD;
  var WHEEL_RATIO = 1.2;          // 轮速 / 踏频

  var wheelBack = $('wheelBack');
  var wheelFront = $('wheelFront');
  var crank = $('crank');
  var bird = $('bird');
  var head = $('head');
  var wing = $('wing');
  var pouch = $('pouch');

  var legs = [
    { ph: 0,        hx: 356, hy: 288, L: 80, thigh: $('farThigh'),  calf: $('farCalf'),  foot: $('farFoot')  },
    { ph: Math.PI,  hx: 372, hy: 292, L: 80, thigh: $('nearThigh'), calf: $('nearCalf'), foot: $('nearFoot') }
  ];

  // 两段等长腿的两骨 IK：给定髋与脚，求膝（取朝前的一侧）
  function knee(hx, hy, px, py, L) {
    var dx = px - hx, dy = py - hy;
    var d = Math.hypot(dx, dy);
    var max = L * 2 - 0.01;
    if (d > max) { dx *= max / d; dy *= max / d; d = max; }
    if (d < 0.01) { d = 0.01; }
    var ux = dx / d, uy = dy / d;
    var a = d / 2;
    var h = Math.sqrt(Math.max(0, L * L - a * a));
    var nx = -uy, ny = ux;
    if (nx < 0) { nx = -nx; ny = -ny; }
    return { x: hx + ux * a + nx * h, y: hy + uy * a + ny * h };
  }

  var phase = 0;
  var last = performance.now();

  function frame(now) {
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) { dt = 0.1; }
    phase = (phase + dt * OMEGA) % TAU;

    var deg = phase * 180 / Math.PI;
    var wheelDeg = (deg * WHEEL_RATIO).toFixed(2);

    wheelBack.setAttribute('transform', 'rotate(' + wheelDeg + ' 300 380)');
    wheelFront.setAttribute('transform', 'rotate(' + wheelDeg + ' 600 380)');
    crank.setAttribute('transform', 'rotate(' + deg.toFixed(2) + ' 420 398)');

    var bob = Math.sin(phase * 2) * 2.4;
    bird.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    head.setAttribute('transform', 'rotate(' + (Math.sin(phase * 2 - 0.7) * 2).toFixed(2) + ' 412 188)');
    wing.setAttribute('transform', 'rotate(' + (Math.sin(phase * 2 + 1.2) * 2.6).toFixed(2) + ' 318 226)');

    var s = (1 + Math.sin(phase * 2 + 0.5) * 0.035).toFixed(3);
    pouch.setAttribute('transform', 'translate(0 148) scale(1 ' + s + ') translate(0 -148)');

    for (var i = 0; i < legs.length; i++) {
      var leg = legs[i];
      var ang = phase + leg.ph;
      var px = BB.x + Math.cos(ang) * CRANK;
      var py = BB.y + Math.sin(ang) * CRANK;
      var hx = leg.hx;
      var hy = leg.hy + bob;
      var k = knee(hx, hy, px, py, leg.L);

      leg.thigh.setAttribute('x1', hx.toFixed(2));
      leg.thigh.setAttribute('y1', hy.toFixed(2));
      leg.thigh.setAttribute('x2', k.x.toFixed(2));
      leg.thigh.setAttribute('y2', k.y.toFixed(2));
      leg.calf.setAttribute('x1', k.x.toFixed(2));
      leg.calf.setAttribute('y1', k.y.toFixed(2));
      leg.calf.setAttribute('x2', px.toFixed(2));
      leg.calf.setAttribute('y2', py.toFixed(2));
      leg.foot.setAttribute('transform', 'translate(' + px.toFixed(2) + ' ' + py.toFixed(2) + ')');
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
